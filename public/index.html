<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8FD97A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LP 258">
  <title data-i18n-doc="app.name">LP 258 小镇</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ============ JOIN SCREEN ============ -->
  <section id="join" class="screen hidden">
    <div class="join-card">
      <div class="brand">
        <span class="brand-logo">🏡</span>
        <div style="flex:1"><h1 data-i18n="app.name"></h1><p data-i18n="app.tagline"></p></div>
        <button class="btn ghost small lang-btn" type="button" data-i18n="lang.switch"></button>
      </div>
      <div class="join-tabs">
        <button type="button" id="tabNew" class="on" data-i18n="join.tabNew"></button>
        <button type="button" id="tabLogin" data-i18n="join.tabLogin"></button>
      </div>
      <!-- new member -->
      <div id="newForm">
        <div class="join-grid">
          <div class="preview-wrap"><canvas id="joinPreview" width="220" height="240"></canvas><button class="btn ghost small" id="joinRandom" data-i18n="join.random"></button></div>
          <div id="joinCustomizer" class="customizer"></div>
        </div>
        <div class="join-fields">
          <label class="field"><span data-i18n="join.nickname"></span><input id="joinName" maxlength="16" data-i18n-ph="join.nickPh" autocomplete="nickname"></label>
          <label class="field"><span data-i18n="join.pinNew"></span><input id="joinPin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="new-password"></label>
        </div>
        <p class="muted pin-hint" data-i18n="join.pinHint"></p>
        <div class="rec-fields">
          <label class="field"><span data-i18n="rec.qLabel"></span><select id="joinRecQ" class="inp"></select></label>
          <input id="joinRecCustom" class="inp hidden" maxlength="60" data-i18n-ph="rec.customPh">
          <label class="field"><span data-i18n="rec.aLabel"></span><input id="joinRecA" class="inp" maxlength="60" data-i18n-ph="rec.answerPh" autocomplete="off"></label>
        </div>
        <button class="btn primary big" id="joinBtn" data-i18n="join.enter"></button>
      </div>
      <!-- returning member on a new phone / browser -->
      <div id="loginForm" class="hidden">
        <p class="muted" data-i18n="join.loginHint"></p>
        <label class="field"><span data-i18n="join.nickname"></span><input id="loginName" maxlength="16" autocomplete="username"></label>
        <label class="field"><span data-i18n="join.pinEnter"></span><input id="loginPin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="current-password"></label>
        <button class="btn primary big" id="loginBtn" data-i18n="join.loginBtn"></button>
        <button type="button" class="link-btn" id="forgotBtn" data-i18n="join.forgotBtn"></button>
        <div id="forgotForm" class="forgot-box hidden">
          <div id="recoverBox" class="hidden">
            <p class="muted" data-i18n="rec.selfHint"></p>
            <p class="rec-q" id="recQText"></p>
            <input id="recAnswer" class="inp" maxlength="60" data-i18n-ph="rec.answerPh" autocomplete="off">
            <label class="field" style="margin:6px 0 0"><span data-i18n="rec.newPin"></span><input id="recNewPin" class="inp pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="new-password"></label>
            <button type="button" class="btn primary" id="recSubmit" data-i18n="rec.submit"></button>
            <button type="button" class="link-btn" id="recAskHost" data-i18n="rec.askHostLink"></button>
          </div>
          <div id="hostBox" class="hidden">
            <p class="muted" data-i18n="join.forgotHint"></p>
            <input id="forgotContact" class="inp" maxlength="80" data-i18n-ph="join.forgotContactPh" autocomplete="tel">
            <button type="button" class="btn small" id="forgotSend" data-i18n="join.forgotSend"></button>
          </div>
        </div>
        <details class="code-login">
          <summary data-i18n="join.haveCode"></summary>
          <div class="row"><input id="codeInput" data-i18n-ph="join.codePh" autocomplete="off"><button class="btn" id="codeBtn" data-i18n="join.login"></button></div>
        </details>
      </div>
      <p class="err" id="joinErr"></p>
    </div>
  </section>

  <!-- ============ TOWN ============ -->
  <section id="town" class="screen hidden">
    <canvas id="world"></canvas>

    <header class="topbar">
      <div class="logo">🏡 <b>LP 258</b></div>
      <button class="pill" id="onlinePill" data-i18n-title="top.friends"><span class="dot"></span><span id="onlineCount">0</span></button>
      <div class="ticker" id="ticker"><span>📢</span><div class="ticker-text" id="tickerText"></div></div>
      <button class="pill season-pill" id="seasonPill" type="button"></button>
      <button class="pill" id="musicBtn" type="button">🎵</button>
      <button class="pill lang-btn" type="button" data-i18n="lang.switch"></button>
      <button class="pill points" id="pointsPill" data-i18n-title="top.points">⭐ <span id="myPoints">0</span></button>
    </header>

    <div id="reminderBar" class="reminder hidden"></div>
    <div id="chatLog" class="chat-log"></div>
    <button id="zoneBtn" class="zone-btn hidden"></button>
    <div id="joy" class="joy hidden"><div class="knob"></div></div>

    <div class="bottom">
      <div class="chatbar">
        <button class="icon-btn" id="emoteToggle" data-i18n-title="chat.emote">😊</button>
        <div class="dm-pill hidden" id="dmPill"></div>
        <input id="chatInput" maxlength="300" data-i18n-ph="chat.ph" autocomplete="off">
        <button class="btn primary" id="chatSend" data-i18n="chat.send"></button>
        <div class="emote-pop hidden" id="emotePop"></div>
      </div>
      <nav class="nav">
        <button data-panel="chat"><i>💬</i><span data-i18n="nav.chat"></span></button>
        <button data-panel="online"><i>👥</i><span data-i18n="nav.online"></span></button>
        <button data-panel="games"><i>🎮</i><span data-i18n="nav.games"></span></button>
        <button data-panel="rank"><i>🏆</i><span data-i18n="nav.rank"></span></button>
        <button data-panel="hq"><i>📍</i><span data-i18n="nav.hq"></span><b class="badge hidden" id="hqBadge"></b></button>
        <button data-panel="me"><i>🏠</i><span data-i18n="nav.me"></span></button>
      </nav>
    </div>

    <aside id="panel" class="panel hidden" aria-live="polite">
      <div class="panel-head"><h2 id="panelTitle"></h2><button class="icon-btn" id="panelClose" data-i18n-title="close">✕</button></div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
  <div id="toasts" class="toasts"></div>

  <script src="i18n.js"></script>
  <script src="avatar.js"></script>
  <script src="room.js"></script>
  <script src="season.js"></script>
  <script src="app.js"></script>
</body>
</html>
