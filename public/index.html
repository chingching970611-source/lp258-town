<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8FD97A">
  <title>LP 258 小鎮</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ============ JOIN SCREEN ============ -->
  <section id="join" class="screen hidden">
    <div class="join-card">
      <div class="brand"><span class="brand-logo">🏡</span><div><h1>LP 258 小鎮</h1><p>同朋友重新連繫，一齊玩、一齊傾！</p></div></div>
      <div class="join-grid">
        <div class="preview-wrap"><canvas id="joinPreview" width="220" height="240"></canvas><button class="btn ghost small" id="joinRandom">🎲 隨機造型</button></div>
        <div id="joinCustomizer" class="customizer"></div>
      </div>
      <label class="field"><span>你嘅暱稱</span><input id="joinName" maxlength="16" placeholder="例如：小明 Ming" autocomplete="nickname"></label>
      <button class="btn primary big" id="joinBtn">進入小鎮 →</button>
      <details class="code-login">
        <summary>已經有帳號？用登入碼登入</summary>
        <div class="row"><input id="codeInput" placeholder="貼上你嘅登入碼" autocomplete="off"><button class="btn" id="codeBtn">登入</button></div>
      </details>
      <p class="err" id="joinErr"></p>
    </div>
  </section>

  <!-- ============ TOWN ============ -->
  <section id="town" class="screen hidden">
    <canvas id="world"></canvas>

    <header class="topbar">
      <div class="logo">🏡 <b>LP 258</b></div>
      <button class="pill" id="onlinePill" title="在綫朋友"><span class="dot"></span><span id="onlineCount">0</span> 在綫</button>
      <div class="ticker" id="ticker"><span>📢</span><div class="ticker-text" id="tickerText"></div></div>
      <button class="pill points" id="pointsPill" title="我的積分">⭐ <span id="myPoints">0</span></button>
    </header>

    <div id="reminderBar" class="reminder hidden"></div>
    <div id="chatLog" class="chat-log"></div>
    <button id="zoneBtn" class="zone-btn hidden"></button>

    <div class="bottom">
      <div class="chatbar">
        <button class="icon-btn" id="emoteToggle" title="表情">😊</button>
        <div class="dm-pill hidden" id="dmPill"></div>
        <input id="chatInput" maxlength="300" placeholder="講啲嘢… (Enter 發送)" autocomplete="off">
        <button class="btn primary" id="chatSend">發送</button>
        <div class="emote-pop hidden" id="emotePop"></div>
      </div>
      <nav class="nav">
        <button data-panel="chat"><i>💬</i><span>聊天</span></button>
        <button data-panel="online"><i>👥</i><span>朋友</span></button>
        <button data-panel="games"><i>🎮</i><span>Game Zone</span></button>
        <button data-panel="rank"><i>🏆</i><span>積分榜</span></button>
        <button data-panel="hq"><i>📍</i><span>HQ 活動</span><b class="badge hidden" id="hqBadge"></b></button>
        <button data-panel="me"><i>👤</i><span>我的</span></button>
      </nav>
    </div>

    <aside id="panel" class="panel hidden" aria-live="polite">
      <div class="panel-head"><h2 id="panelTitle"></h2><button class="icon-btn" id="panelClose" title="關閉">✕</button></div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
  <div id="toasts" class="toasts"></div>

  <script src="avatar.js"></script>
  <script src="app.js"></script>
</body>
</html>
